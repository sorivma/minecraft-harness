name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Harness, Minecraft/Forge, Java, Codex and operating system
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Steps, expected behavior and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, authorization headers, personal paths and conversation content.
      render: text
