name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify tag and version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties)"
          test "$RELEASE_TAG" = "v$version"
          test -s "docs/releases/$version.md"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Verify and build
        run: bash ./gradlew --no-daemon spotlessCheck check build releaseBundle --stacktrace
      - name: Package and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/prepare-release.py --version "${RELEASE_TAG#v}" --tag "$RELEASE_TAG"
      - name: Attest artifact provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            build/release/*.jar
            build/release/*.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: build/release/
          if-no-files-found: error
          retention-days: 14
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-test-reports
          path: '**/build/reports/tests/'
          retention-days: 14
  publish:
    name: Publish immutable release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release
      - name: Verify downloaded artifacts
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Create draft, attach assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release/* --verify-tag --draft --title "Minecraft Harness ${RELEASE_TAG#v}" --notes-file release/RELEASE_NOTES.md "${args[@]}"
          gh release edit "$RELEASE_TAG" --draft=false
